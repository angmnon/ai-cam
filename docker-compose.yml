# 本地开发基础设施（Phase 0）：PostgreSQL + Redis + MinIO（S3 兼容，R2 本地替身）+ API
# 启动：docker compose up -d
# API 本地运行：pnpm --filter @ai-cam/api dev（数据文件默认 ./data）
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-cam-postgres
    environment:
      POSTGRES_USER: aicam
      POSTGRES_PASSWORD: aicam_dev
      POSTGRES_DB: aicam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicam -d aicam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-cam-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # P0-04：MinIO 作为 R2/S3 本地替身（Docker Hub minio/minio 拉取被拒，改用 quay.io）
  # S3 API 9000 / Console 9001；凭据 minioadmin/minioadmin
  minio:
    image: quay.io/minio/minio:latest
    container_name: ai-cam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # P0-05：API 服务（多阶段镜像，prod deps only）
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: ai-cam-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://aicam:aicam_dev@postgres:5432/aicam
      JWT_SECRET: dev-secret-change-me
      ADMIN_EMAIL: admin@ai-cam.local
      ADMIN_PASSWORD: changeme-admin
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      STORAGE_DRIVER: local
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
