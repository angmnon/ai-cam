# 本地开发基础设施（Phase 0）：PostgreSQL + Redis
# 启动：docker compose up -d
# API 本地运行：pnpm --filter @ai-cam/api dev（数据文件默认 ./data）
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-cam-postgres
    environment:
      POSTGRES_USER: aicam
      POSTGRES_PASSWORD: aicam_dev
      POSTGRES_DB: aicam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicam -d aicam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-cam-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
