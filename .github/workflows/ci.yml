name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # P1-18 阶段③：golden 回归 / 工厂验证 / Beta 采样 / 迁移检查独立门禁（非零退出即 job 失败）
      - name: Golden regression
        run: pnpm --filter @ai-cam/regression run regression

      - name: Factory validation
        run: pnpm --filter @ai-cam/factory-validation run factory-check

      - name: Beta sample
        run: pnpm --filter @ai-cam/beta-sample run sample

      - name: Migration check
        run: pnpm run check:migrations

      # P2-38：SBOM 生成门禁（非零退出即失败）
      # 注：pnpm 11 内置同名 sbom 命令会遮蔽包脚本，故用 pnpm run sbom 显式调用 package.json 脚本
      - name: SBOM
        run: pnpm run sbom

  security:
    name: security & supply-chain scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod
      # 许可证/SBOM 门禁在 Phase 1 接入（依赖固定 + SPDX 清单），见 20_开源许可证与SBOM合规规范
      - name: SAST (eslint security rules 占位)
        run: pnpm lint
